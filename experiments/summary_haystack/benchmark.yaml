name: Summary of a Haystack
quality_adapter: agent_cost_model.experiments.summary_haystack.quality_evaluator
results_prefix: '{results_dir}/summary_haystack/{use_case}/q{query_id}/{runner}'
sampling_dir: '{results_dir}/summary_haystack/{use_case}/_sampling'
sampling_results_path: '{results_dir}/summary_haystack/{use_case}/_sampling/sampling_results.json'
use_cases:
  news1:
    query_source:
      type: text
      modalities:
      - text
    task_prompts:
      '1': |-
        You are given news articles about the main subject "Comprehensive Analysis of Dodge V8 Muscle Cars: Evolution, Performance, and Future Trends."

        Each article is one input row: idx is its ID and document is its text.

        In some of the conversation the following topic is discussed: "Fuel types and their impact on performance".
        Your objective is to summarize the [N_insights] main insights from the conversations regarding that topic.
        One of the insights to be summarized is "When running on E85, the Dodge Challenger SRT Demon 170 can reach 1,025 hp because E85 has a higher octane rating, allowing for better knock resistance and more power output." Return all insights on the topic, including this one; the others are about different aspects of the topic than this example.
        Careful:
        - [Format] You should format your summary as a bullet point list, where each bullet point is a different insight consisting of a single sentence.
        - [References] For each insight, you should refer to the relevant articles by using the IDs given in the article list. For example: "Increased demand for vaccines may strain already fragile supply chains [1][4]" which means that the insight is supported by Document 1 and Document 4. No need to say "Article 14", you can just use the following structure: "[14]".
        - [Length] Your summary should be no longer than 300 words in total.

        N_insights, in square brackets above, is a placeholder: on every LLM call it is replaced by the number of the topic's insights that the documents the plan runs on hold. Copy it verbatim, brackets included, into any instruction that needs it.

        Output a single row with:
          summary   the bullet point list, one bullet per line
