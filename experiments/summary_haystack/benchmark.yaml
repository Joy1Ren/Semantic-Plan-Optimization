        You are given conversations within the following scenario: "A 25-minute meeting between a doctor and a patient discussing the patient's recent health concerns and treatment options.".
        The conversations involve the following participants: doctor, patient. In each conversation, the participants might be different, with different names, but all the conversations fall into the same scenario.

        Each conversation is one input row: idx is its ID and document is its text.

        Your objective is to produce a summary of all the document with [N_insights] bullet points covering the main insights regarding the following query: Are recent symptoms being discussed?.
        One of the insights to be summarized is "The doctor asks when the recent symptoms first appeared, and the patient responds that the symptoms started roughly 10 days ago." Return all insights on the topic, including this one; the others are about different aspects of the topic than this example.
        Careful:
        - [Format] You should format your summary as a bullet point list, where each bullet point is a different insight.
        - [References] For each insight, you should refer to the relevant conversations by using the IDs given in the conversation list. For example: "some of the doctors ask patients for their medical history[1][4]" which means that the insight is supported by Document 1 and Document 4. No need to say "Conversation 14", you can just use the following structure: "[14]".
        - [Length] Your summary should be no longer than 300 words in total.

        N_insights, in square brackets above, is a placeholder: on every LLM call it is replaced by the number of the query's insights that the documents the plan runs on hold. Copy it verbatim, brackets included, into any instruction that needs it.

