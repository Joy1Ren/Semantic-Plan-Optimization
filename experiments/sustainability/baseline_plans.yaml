# Hand-written baseline plans for the sustainability benchmark: one reasonable, unoptimized plan per
# query, the comparison point for what the optimizer finds. Run with experiments/run_baseline.py.
#
# Keyed by query id. Each value is plan code, executed in the same sandbox WritePlanTool uses, plus
# `source_csv` -- the query's source file name as benchmark.yaml resolves it. The last expression
# must be the PhysicalPipeline. Operator wording repeats benchmark.yaml's task prompts, which repeat
# the definitions the ground-truth labelers were given (queries.py).
#
# Every LLM operator uses gpt-6-luna.

# identify: the company is a member of RE100
"1": |
  pipe = PhysicalPipeline(plan_name, "documents", load_data(source_csv))
  pipe.sem_map(
      cols=[
          {"name": "qualifies", "type": bool, "description": "True if the document states that the company that issued the document is a member of RE100, the global initiative of companies committed to 100% renewable electricity."},
          {"name": "reason", "type": str, "description": "If it qualifies, one verbatim quote from the document: the complete phrase or sentence that states it, copied exactly as it appears in the document, so that the quote sufficiently justifies the verdict. Otherwise empty."},
      ],
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.filter(lambda row: bool(row["qualifies"]))
  pipe.project(["idx", "reason"])
  pipe

# identify: SBTi-validated emissions targets
"2": |
  pipe = PhysicalPipeline(plan_name, "documents", load_data(source_csv))
  pipe.sem_map(
      cols=[
          {"name": "qualifies", "type": bool, "description": "True if the document states that the Science Based Targets initiative (SBTi) has validated (also called approved) an emissions reduction target of the company that issued the document."},
          {"name": "reason", "type": str, "description": "If it qualifies, one verbatim quote from the document: the complete phrase or sentence that states it, copied exactly as it appears in the document, so that the quote sufficiently justifies the verdict. Otherwise empty."},
      ],
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.filter(lambda row: bool(row["qualifies"]))
  pipe.project(["idx", "reason"])
  pipe

# identify: an internal carbon price currently in use
"3": |
  pipe = PhysicalPipeline(plan_name, "documents", load_data(source_csv))
  pipe.sem_map(
      cols=[
          {"name": "qualifies", "type": bool, "description": "True if the document states that the company that issued it currently uses an internal carbon price. An internal carbon price is a monetary value assigned to greenhouse gas emissions as a means of accounting for the costs of climate change regulation or a company's climate action ambitions."},
          {"name": "reason", "type": str, "description": "If it qualifies, one verbatim quote from the document: the complete phrase or sentence that states it, copied exactly as it appears in the document, so that the quote sufficiently justifies the verdict, including the price if the document states one. Otherwise empty."},
      ],
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.filter(lambda row: bool(row["qualifies"]))
  pipe.project(["idx", "reason"])
  pipe

# identify: companies with 1 to 4 work-related fatalities in the reporting period
"4": |
  import re
  pipe = PhysicalPipeline(plan_name, "documents", load_data(source_csv))
  pipe.sem_map(
      cols=[
          {"name": "fatalities", "type": str, "description": "The number of work-related fatalities among the employees and contractors of the company that issued the document during the period the document reports on. Give the number, or \"not reported\" if the document does not report it."},
      ],
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.filter(lambda row: bool(re.search(r"\d", str(row["fatalities"])))
              and 1 <= int(re.search(r"\d[\d,]*", str(row["fatalities"])).group(0).replace(",", "")) <= 4)
  pipe.project(["idx"])
  pipe

# identify: manufacturers with SBTi-validated targets
"5": |
  pipe = PhysicalPipeline(plan_name, "documents", load_data(source_csv))
  pipe.sem_filter(
      "Both hold: (1) the primary economic activity of the company that issued the document is manufacturing; (2) the document states that the Science Based Targets initiative (SBTi) has validated (also called approved) an emissions reduction target of the company that issued the document.",
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.project(["idx"])
  pipe

