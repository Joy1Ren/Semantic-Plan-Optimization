# ---- retired queries, kept so their results can be reproduced ----
# classify: sustainability reports, their issuing company and its sector
"100": |
  pipe = PhysicalPipeline(plan_name, "documents", load_data(source_csv))
  pipe.sem_filter(
      "The document is a sustainability report: a report a company publishes to disclose the environmental, social and governance impacts and performance of its activities.",
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.sem_map(
      cols=[
          {"name": "company_name", "type": str, "description": "The name of the company that issued the report."},
          {"name": "economic_activity", "type": str, "description": "The company's primary economic activity, exactly one of: agriculture (agriculture, forestry and fishing); mining (mining and quarrying); manufacturing (manufacturing); energy_supply (electricity, gas, steam and air conditioning supply); water_supply (water supply; sewerage, waste management and remediation activities); construction (construction); trade_repair (wholesale and retail trade; repair of motor vehicles and motorcycles); transportation (transportation and storage); accommodation_food (accommodation and food service activities); information_communication (information and communication); finance_insurance (financial and insurance activities); real_estate (real estate activities); professional_scientific (professional, scientific and technical activities); administrative_support (administrative and support service activities); public_administration (public administration and defence; compulsory social security); education (education); health_social (human health and social work activities); arts_entertainment (arts, entertainment and recreation); other (other service activities); households (activities of households as employers; undifferentiated goods- and services-producing activities of households for own use); extraterritorial (activities of extraterritorial organisations and bodies)"},
      ],
      model=pz.Model.GPT_6_LUNA,
      depends_on=["document"],
  )
  pipe.project(["idx", "company_name", "economic_activity"])
  pipe

